<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Watermark PDF - PDFSmart Tools</title>
<link href="tools-common.css" rel="stylesheet"/>
<link href="add-watermark.css?v=20" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<meta content="Add a text watermark to PDF pages with the PDFSmart Tools watermark feature. Check the downloaded file to confirm placement and readability." name="description"/><link href="https://pdfsmarttools.in/add-watermark.html" rel="canonical"/><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6167762191554858" crossorigin="anonymous"></script>

<style id="pdfsmart-drag-drop-styles">
.file-drop-zone { transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease; }
.drop-hint { margin-top: 8px; font-size: .9em; opacity: .78; }
.file-drop-zone.file-drag-active { border: 2px dashed #2563eb !important; background: #eff6ff !important; box-shadow: 0 0 0 4px rgba(37,99,235,.10); }
.file-drop-zone.file-drag-active * { pointer-events: none; }
</style>

</head>
<body>
<header class="topbar">
<div class="logo">📄 PDFSmart Tools</div>
<a class="home-btn" href="index.html">← Back to Home</a>
</header>
<section class="watermark-layout">
<div class="watermark-card">
<div class="upload-section" id="uploadSection">
<h1>Watermark PDF</h1>
<p>Select PDF file and add text watermark to all or selected pages.</p>
<label class="upload-area" for="pdfFile">
<div class="upload-icon">📤
<p class="drop-hint">Or drag and drop your file here</p>
</div>
<h2>Choose PDF File</h2>
<p>Select one PDF file</p>
</label>
<input accept="application/pdf" id="pdfFile" type="file"/>
</div>
<div class="work-section" id="workSection" style="display:none;">
<div class="work-header">
<div>
<h2>Watermark PDF</h2>
<p>Preview first page and apply watermark.</p>
</div>
<label class="change-file-btn" for="pdfFile">
                    Change PDF
                </label>
</div>
<div class="preview-options-grid">
<div class="pdf-preview-box">
<h3>PDF Preview</h3>
<div class="pdf-preview">
<canvas id="previewCanvas"></canvas>
</div>
<div class="file-info" id="fileInfo">
                        No PDF selected
                    </div>
</div>
<div class="options-box">
<h3>Watermark Options</h3>
<label>Watermark Text</label>
<input id="watermarkText" type="text" value="PDFSmart Tools"/>
<label>Pages</label>
<input id="pageInput" placeholder="Example: all or 1-3, 5" type="text" value="all"/>
<small>
                        Use <b>all</b> for all pages, or enter pages like 1-3, 5.
                    </small>
<label>Watermark Color</label>
<input id="watermarkColor" type="color" value="#808080"/>
<label>Font Size</label>
<input id="fontSize" type="number" value="60"/>
<label>Opacity</label>
<input id="opacity" max="100" min="10" type="range" value="20"/>
<label>Rotation</label>
<select id="rotation">
<option value="-45">Diagonal Left (-45°)</option>
<option value="45">Diagonal Right (45°)</option>
<option value="0">Horizontal (0°)</option>
<option value="90">Vertical (90°)</option>
</select>
<label>Position</label>
<select id="position">
<option value="center">Center</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
</select>
<button class="watermark-btn" id="watermarkBtn">
                        Add Watermark &amp; Download PDF
                    </button>
<div class="status-text" id="statusText"></div>
</div>
</div>
</div>
</div>
</section>
<script src="add-watermark.js?v=20"></script>

<script src="upload-drag.js?v=27"></script>
</body>
</html>
