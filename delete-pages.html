<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delete Pages - PDFSmart Tools</title>
<link href="tools-common.css" rel="stylesheet"/>
<link href="delete-pages.css?v=20" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<meta content="Remove selected pages from a PDF and download the revised document. Check page order and content before sharing." name="description"/><link href="https://pdfsmarttools.in/delete-pages.html" rel="canonical"/><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6167762191554858" crossorigin="anonymous"></script>
</head>
<body>
<header class="topbar">
<div class="logo">📄 PDFSmart Tools</div>
<a class="home-btn" href="index.html">← Back to Home</a>
</header>
<section class="tool-layout">
<div class="tool-card">
<div class="upload-section" id="uploadSection">
<h1>Delete Pages</h1>
<p>Select PDF file and remove unwanted pages.</p>
<label class="upload-area" for="pdfFile">
<div class="upload-icon">📤</div>
<h2>Choose PDF File</h2>
<p>Select one PDF file</p>
</label>
<input accept="application/pdf" id="pdfFile" type="file"/>
</div>
<div class="work-section" id="workSection" style="display:none;">
<div class="work-header">
<div>
<h2>Delete Pages</h2>
<p>Enter page numbers or ranges to delete from PDF.</p>
</div>
<label class="change-file-btn" for="pdfFile">
                    Change PDF
                </label>
</div>
<div class="preview-options-grid">
<div class="pdf-preview-box">
<h3>PDF Preview</h3>
<div class="pdf-preview">
<canvas id="previewCanvas"></canvas>
</div>
<div class="file-info" id="fileInfo">
                        No PDF selected
                    </div>
</div>
<div class="options-box">
<h3>Delete Options</h3>
<label>Pages to Delete</label>
<input id="pageInput" placeholder="Example: 2, 4-6" type="text"/>
<small>
                        Enter pages like <b>2, 4-6</b>. These pages will be removed from the PDF.
                    </small>
<button class="main-btn" id="deleteBtn">
                        Delete Pages &amp; Download PDF
                    </button>
<div class="status-text" id="statusText"></div>
</div>
</div>
</div>
</div>
</section>
<script src="delete-pages.js?v=20"></script>
</body>
</html>
